<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Rounded Squircle Clip -->
    <clipPath id="squircleClip">
      <rect x="16" y="16" width="224" height="224" rx="52" ry="52" />
    </clipPath>

    <!-- Light Mode Gradient -->
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Dark Mode Gradient -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27303F" />
      <stop offset="100%" stop-color="#11161D" />
    </linearGradient>

    <!-- Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Moon Gradient -->
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Base Clipped Container -->
  <g clip-path="url(#squircleClip)">
    <!-- Light Half (Top-Left) -->
    <rect x="16" y="16" width="224" height="224" fill="url(#lightBg)" />

    <!-- Dark Half (Bottom-Right Diagonal) -->
    <polygon points="240,16 240,240 16,240" fill="url(#darkBg)" />

    <!-- Diagonal Divider Highlight -->
    <line x1="240" y1="16" x2="16" y2="240" stroke="#94A3B8" stroke-opacity="0.35" stroke-width="2" />

    <!-- Sun (Top-Left) -->
    <g transform="translate(82, 82)">
      <circle cx="0" cy="0" r="20" fill="url(#sunGrad)" />
      <g stroke="#F59E0B" stroke-width="5" stroke-linecap="round">
        <line x1="0" y1="-34" x2="0" y2="-27" />
        <line x1="0" y1="27" x2="0" y2="34" />
        <line x1="-34" y1="0" x2="-27" y2="0" />
        <line x1="27" y1="0" x2="34" y2="0" />
        <line x1="-24" y1="-24" x2="-19" y2="-19" />
        <line x1="19" y1="19" x2="24" y2="24" />
        <line x1="24" y1="-24" x2="19" y2="-19" />
        <line x1="-19" y1="19" x2="-24" y2="24" />
      </g>
    </g>

    <!-- Crescent Moon & Star (Bottom-Right) -->
    <g transform="translate(172, 172)">
      <path d="M 8 -26 A 28 28 0 1 0 26 12 A 22 22 0 1 1 8 -26 Z" fill="url(#moonGrad)" />
      <!-- Four-point Sparkle -->
      <path d="M -22 -18 Q -22 -10 -14 -10 Q -22 -10 -22 -2 Q -22 -10 -30 -10 Q -22 -10 -22 -18 Z" fill="#BAE6FD" />
    </g>
  </g>

  <!-- Crisp Outer Border (Adapts to Light & Dark Taskbars) -->
  <rect x="16.75" y="16.75" width="222.5" height="222.5" rx="51.25" ry="51.25" fill="none" stroke="#64748B" stroke-opacity="0.45" stroke-width="1.5" />
</svg>